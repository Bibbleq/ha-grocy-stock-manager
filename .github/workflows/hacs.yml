name: HACS

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS repository on pull request
        if: github.event_name == 'pull_request'
        uses: hacs/action@main
        with:
          category: integration
          # HACS reads licence metadata from the default branch, so it cannot
          # detect a licence first introduced by this pull request.
          ignore: brands license
      - name: Validate HACS repository
        if: github.event_name != 'pull_request'
        uses: hacs/action@main
        with:
          category: integration
          # A bespoke brand asset will be added before requesting inclusion in
          # the default HACS catalogue; that design work is intentionally
          # outside this read-only API phase.
          ignore: brands
