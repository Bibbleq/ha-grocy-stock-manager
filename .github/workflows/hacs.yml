name: HACS

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration
          # A bespoke brand asset will be added before requesting inclusion in
          # the default HACS catalogue; that design work is intentionally
          # outside this read-only API phase.
          ignore: brands
