lookup:
  name: Look up Grocy product
  description: >-
    Resolve one barcode, product ID, or exact product name and return canonical
    product, barcode, location, and current-stock data. This action never changes
    stock.
  fields:
    barcode:
      name: Barcode
      description: Exact product barcode. Leading zeroes are preserved.
      example: "0123456789012"
      selector:
        text:
    product_id:
      name: Product ID
      description: Exact internal Grocy product ID.
      example: 1
      selector:
        number:
          min: 1
          mode: box
    product_name:
      name: Product name
      description: Exact canonical Grocy product name.
      example: Cat litter
      selector:
        text:

research_barcode:
  name: Research an unknown barcode
  description: >-
    Final fallback for a barcode not found in Grocy or deterministic catalogues.
    Ask a Home Assistant AI Task with live web search to identify the product;
    optional Tavily evidence is supplied for comparison. Only an independently
    verified exact-EAN verdict is accepted. This action never changes Grocy stock
    or catalogue data.
  fields:
    barcode:
      name: Barcode
      required: true
      selector:
        text:
    ai_task_entity_id:
      name: AI Task entity
      required: true
      selector:
        entity:
          domain: ai_task
confirm_product:
  name: Confirm Grocy product
  description: >-
    After a person has confirmed an unknown barcode and exact product name,
    idempotently create a new Grocy product or map the barcode to an existing
    exact-name product. This action does not add stock.
  fields:
    barcode:
      name: Barcode
      description: Exact confirmed barcode. Leading zeroes are preserved.
      required: true
      selector:
        text:
    product_name:
      name: Product name
      description: >-
        Exact confirmed name. If this exactly matches an existing product, the
        barcode is added to that product instead of creating a duplicate.
      required: true
      selector:
        text:
    barcode_amount:
      name: Units represented by this barcode
      description: >-
        One for a normal item, or the number of stock units in a multipack.
        This value is stored on the Grocy barcode mapping.
      default: 1
      selector:
        number:
          min: 1
          max: 1000
          step: 1
          mode: box
    location_id:
      name: Default location ID
      description: Exact Grocy default location ID; do not also set a name.
      selector:
        number:
          min: 1
          mode: box
    location_name:
      name: Default location name
      description: Exact Grocy default location name; do not also set an ID.
      selector:
        text:
    quantity_unit_id:
      name: Quantity unit ID
      description: Optional exact Grocy quantity unit ID; do not also set a name.
      selector:
        number:
          min: 1
          mode: box
    quantity_unit_name:
      name: Quantity unit name
      description: Optional exact Grocy quantity unit name. Defaults to Pack.
      selector:
        text:

confirm_product_transaction:
  name: Confirm product and apply captured stock action
  description: >-
    Atomically preserve the scanner's original add or consume intent while a
    person identifies an unknown barcode. The product is created or mapped,
    then that exact captured stock action is verified and journalled. A retry
    with the same request ID cannot change stock twice.
  fields:
    barcode:
      name: Barcode
      description: Exact confirmed barcode. Leading zeroes are preserved.
      required: true
      selector:
        text:
    product_name:
      name: Product name
      description: Exact product name selected or entered by the person.
      required: true
      selector:
        text:
    barcode_amount:
      name: Units represented by this barcode
      description: >-
        One for a normal item, or the number of stock units in a multipack.
        The captured scan amount is multiplied by this value.
      default: 1
      selector:
        number:
          min: 1
          max: 1000
          step: 1
          mode: box
    operation:
      name: Original operation
      description: The add or consume action captured when the barcode was scanned.
      required: true
      selector:
        select:
          options:
            - add
            - consume
    amount:
      name: Amount
      description: Positive quantity captured when the barcode was scanned.
      default: 1
      selector:
        number:
          min: 0.001
          step: 1
          mode: box
    location_id:
      name: Location ID
      description: Optional exact Grocy location ID; do not also set a name.
      selector:
        number:
          min: 1
          mode: box
    location_name:
      name: Location name
      description: Optional exact Grocy location name; do not also set an ID.
      selector:
        text:
    quantity_unit_id:
      name: Quantity unit ID
      description: Optional exact Grocy quantity unit ID; do not also set a name.
      selector:
        number:
          min: 1
          mode: box
    quantity_unit_name:
      name: Quantity unit name
      description: Optional exact Grocy quantity unit name. Defaults to Pack.
      selector:
        text:
    request_id:
      name: Request ID
      description: Unique ID captured with the original scanner action.
      required: true
      selector:
        text:
    source:
      name: Source
      description: Short workflow origin such as scanner, dashboard, or voice.
      default: scanner
      selector:
        text:

add:
  name: Add Grocy stock
  description: >-
    Add stock at an explicit location or the product default, then verify the
    resulting quantity. A request ID is mandatory and safely deduplicated
    across Home Assistant restarts. Expected safety rejections return
    outcome: rejected, stock_changed: false, and a machine-readable error_code.
  fields: &mutation_fields
    barcode:
      name: Barcode
      description: Exact product barcode. Use exactly one product identifier.
      example: "0123456789012"
      selector:
        text:
    product_id:
      name: Product ID
      description: Exact Grocy product ID. Use exactly one product identifier.
      selector:
        number:
          min: 1
          mode: box
    product_name:
      name: Product name
      description: Exact Grocy product name. Use exactly one product identifier.
      selector:
        text:
    amount:
      name: Amount
      description: Positive quantity in the product's stock unit.
      default: 1
      selector:
        number:
          min: 0.001
          step: 1
          mode: box
    location_id:
      name: Location ID
      description: Optional exact Grocy location ID; do not also set a name.
      selector:
        number:
          min: 1
          mode: box
    location_name:
      name: Location name
      description: Optional exact Grocy location name; do not also set an ID.
      selector:
        text:
    request_id:
      name: Request ID
      description: >-
        Unique ID for this user action. Retrying the same ID returns the stored
        result and cannot apply the stock change twice.
      required: true
      selector:
        text:
    source:
      name: Source
      description: Short origin label such as scanner, dashboard, or voice.
      default: home_assistant
      selector:
        text:

consume:
  name: Consume Grocy stock
  description: >-
    Remove stock from an explicit location. When omitted, the action safely
    infers a sole stocked location or uses an unambiguous default, then verifies
    the resulting quantity. Expected safety rejections return outcome: rejected,
    stock_changed: false, and a machine-readable error_code.
  fields: *mutation_fields

undo_transaction:
  name: Undo verified stock transaction
  description: >-
    Apply one verified compensating transaction to a recent committed add or
    consume. The same original transaction cannot be undone twice.
  fields:
    original_request_id:
      name: Original request ID
      description: Request ID of the committed transaction to undo.
      required: true
      selector:
        text:

acknowledge_reconciliation:
  name: Acknowledge stock reconciliation
  description: >-
    Clear a transaction's reconciliation-required health latch after a person
    has physically checked and corrected the relevant Grocy stock.
  fields:
    original_request_id:
      name: Original request ID
      description: Request ID of the unresolved transaction.
      required: true
      selector:
        text:
    note:
      name: Reconciliation note
      description: Short record of the physical check or correction performed.
      required: true
      selector:
        text:
          multiline: true

resolve_product_phrase:
  name: Resolve spoken product phrase
  description: >-
    Search current Grocy products and their voice aliases for a spoken phrase.
    Exact canonical or unique aliases resolve authoritatively. Similar names are
    confirmation candidates only and never change stock.
  fields:
    product_phrase:
      name: Product phrase
      description: Product wording captured from speech, such as hair gel.
      required: true
      selector:
        text:
    operation:
      name: Operation
      description: Stock intent used to rank live candidates.
      default: consume
      selector:
        select:
          options:
            - add
            - consume
    candidate_limit:
      name: Candidate limit
      description: Maximum candidates to return for confirmation.
      default: 3
      selector:
        number:
          min: 1
          max: 5
          mode: box

voice_transaction:
  name: Process voice stock transaction
  description: >-
    Resolve a spoken product phrase and execute a verified stock transaction
    only for an authoritative exact or learned match. Uncertain matches return
    a short-lived confirmation token and candidates without changing stock.
  fields:
    operation:
      name: Operation
      required: true
      selector:
        select:
          options:
            - add
            - consume
    product_phrase:
      name: Product phrase
      description: Product wording captured from speech.
      required: true
      selector:
        text:
    amount:
      name: Amount
      description: Positive quantity in the product's stock unit.
      default: 1
      selector:
        number:
          min: 0.001
          step: 1
          mode: box
    location_id:
      name: Location ID
      description: Optional exact Grocy location ID; do not also set a name.
      selector:
        number:
          min: 1
          mode: box
    location_name:
      name: Location name
      description: Optional exact Grocy location name; do not also set an ID.
      selector:
        text:
    request_id:
      name: Request ID
      description: Unique ID used by the durable transaction journal.
      required: true
      selector:
        text:
    source:
      name: Source
      description: Voice satellite or workflow source label.
      default: voice
      selector:
        text:
    candidate_limit:
      name: Candidate limit
      description: Maximum products offered when confirmation is required.
      default: 3
      selector:
        number:
          min: 1
          max: 5
          mode: box

confirm_voice_transaction:
  name: Confirm voice stock transaction
  description: >-
    Confirm one product offered by a recent voice transaction, optionally learn
    the spoken alias in Grocy, and execute the original verified transaction.
  fields:
    confirmation_token:
      name: Confirmation token
      description: Short-lived opaque token returned by voice_transaction.
      required: true
      selector:
        text:
    product_id:
      name: Product ID
      description: Exact Grocy product ID selected from the offered candidates.
      required: true
      selector:
        number:
          min: 1
          mode: box
    learn_alias:
      name: Learn alias
      description: Save the original phrase on the Grocy product after confirmation.
      default: true
      selector:
        boolean:

learn_product_alias:
  name: Learn spoken product alias
  description: >-
    Save a confirmed spoken phrase on one exact Grocy product. Reassigning an
    existing alias to a different product is rejected.
  fields:
    product_phrase:
      name: Product phrase
      required: true
      selector:
        text:
    product_id:
      name: Product ID
      required: true
      selector:
        number:
          min: 1
          mode: box

remove_product_alias:
  name: Forget spoken product alias
  description: Remove one voice alias from its Grocy product without changing stock.
  fields:
    product_phrase:
      name: Product phrase
      required: true
      selector:
        text:

list_product_aliases:
  name: List spoken product aliases
  description: Return every Grocy-backed voice alias and any conflicts.

merge_products:
  name: Merge Grocy products
  description: >-
    Preview or execute Grocy's native transactional product merge. Stock,
    history, barcodes, recipes, meal plans, and shopping-list references move
    to the kept product atomically. Voice aliases are preserved and the full
    result is read back. The removed Grocy product is permanently deleted by
    Grocy only after the native merge commits. Dry run is enabled by default.
  fields:
    product_id_to_keep:
      name: Product ID to keep
      description: Existing Grocy product that will remain after the merge.
      required: true
      selector:
        number:
          min: 1
          mode: box
    product_id_to_remove:
      name: Product ID to remove
      description: >-
        Existing duplicate product Grocy will permanently delete after moving
        all of its linked data to the kept product.
      required: true
      selector:
        number:
          min: 1
          mode: box
    canonical_name:
      name: Canonical name
      description: Optional final name for the kept product.
      selector:
        text:
    request_id:
      name: Request ID
      description: >-
        Unique ID for this merge. Reusing it replays the recorded result and
        cannot merge a second time.
      required: true
      selector:
        text:
    dry_run:
      name: Dry run
      description: Return the exact merge plan without changing Grocy.
      default: true
      selector:
        boolean:

start_product_identification:
  name: Identify unknown product in background
  description: >-
    Persist the complete captured scanner intent, return immediately and ask a
    Home Assistant conversation agent or AI Task to identify the barcode in
    the background. An AI Task uses configured evidence-gated web research.
    Progress and results are emitted through
    grocy_stock_manager_identification_updated and exposed on the Status
    sensor. This action never changes Grocy stock.
  fields:
    barcode:
      name: Barcode
      required: true
      selector:
        text:
    operation:
      name: Captured operation
      required: true
      selector:
        select:
          options:
            - add
            - consume
    amount:
      name: Captured amount
      default: 1
      selector:
        number:
          min: 0.001
          step: 1
          mode: box
    location_id:
      name: Captured location ID
      selector:
        number:
          min: 1
          mode: box
    location_name:
      name: Captured location name
      selector:
        text:
    quantity_unit_id:
      name: Quantity unit ID
      selector:
        number:
          min: 1
          mode: box
    quantity_unit_name:
      name: Quantity unit name
      default: Pack
      selector:
        text:
    request_id:
      name: Captured request ID
      required: true
      selector:
        text:
    source:
      name: Source
      default: scanner
      selector:
        text:
    agent_id:
      name: Conversation agent or AI Task ID
      required: true
      description: >-
        Use an ai_task entity for evidence-gated web research, or a conversation
        entity for the legacy direct prompt path.
      selector:
        text:

confirm_product_identification:
  name: Confirm queued product identification
  description: >-
    Confirm one durable identification job. The integration uses the job's
    immutable add/consume intent, performs one idempotent verified stock
    transaction, completes the queue item before optional aliases are learned,
    and returns metadata failures as warnings rather than transaction failures.
  fields:
    job_id:
      name: Identification job ID
      required: true
      selector:
        text:
    product_name:
      name: Confirmed product name
      required: true
      selector:
        text:
    product_aliases:
      name: Voice aliases
      description: Optional aliases to learn after the stock commit is complete.
      selector:
        text:
          multiple: true
    barcode_amount:
      name: Units represented by this barcode
      description: >-
        Number of product stock units represented by one scan. Use 1 for a
        normal item, 4 for a four-pack, and so on. The value is stored on the
        Grocy barcode mapping and scales the captured stock action.
      default: 1
      selector:
        number:
          min: 1
          max: 1000
          step: 1
          mode: box

override_product_identification:
  name: Override product identification now
  description: >-
    Ignore any late AI result and move this durable job to a persisted catalogue
    suggestion or immediate manual product entry. The captured stock intent
    remains unchanged.
  fields:
    job_id:
      name: Identification job ID
      required: true
      selector:
        text:
    product_name:
      name: Product name
      description: >-
        Optional trusted catalogue suggestion to persist on this queue item.
        Omit to request manual entry.
      selector:
        text:
    product_aliases:
      name: Voice aliases
      description: Optional catalogue-derived aliases to retain with the suggestion.
      selector:
        text:
          multiple: true

complete_product_identification:
  name: Complete product identification
  description: >-
    Mark durable identification work complete after the existing verified
    confirm_product_transaction action has committed the captured stock intent.
  fields:
    job_id:
      name: Identification job ID
      required: true
      selector:
        text:
    product_name:
      name: Confirmed product name
      required: true
      selector:
        text:

reject_product_identification:
  name: Reject product identification
  description: >-
    Explicitly reject one durable identification job. No stock is changed.
  fields:
    job_id:
      name: Identification job ID
      required: true
      selector:
        text:
